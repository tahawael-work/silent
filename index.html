<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silence Reminder float</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --mat:#2e6e5a; --grid:rgba(255,255,255,.13); --grid2:rgba(255,255,255,.06);
  --paper:#fffdf7; --ink:#1f2a4d; --note:#ffe17d; --blush:#ffd3cc;
  --yarn:#2f80c8; --coral:#ef5b4c; --felt:#f5b83d; --pink:#f4a6b8; --sky:#8fd0ee; --lime:#8bb83a;
  --shade:rgba(10,30,25,.35);
  --hand:"Patrick Hand","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --brush:"Caveat Brush","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--mat:#193a31;--grid:rgba(255,255,255,.09);--grid2:rgba(255,255,255,.04);--paper:#efe9da;--note:#e8c964;--blush:#f0bdb5;--shade:rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{--mat:#193a31;--grid:rgba(255,255,255,.09);--grid2:rgba(255,255,255,.04);--paper:#efe9da;--note:#e8c964;--blush:#f0bdb5;--shade:rgba(0,0,0,.5);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--hand);font-size:1.15rem;
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
  display:flex;justify-content:center;
}
main{width:100%;max-width:440px;padding:34px 22px 48px;display:flex;flex-direction:column;align-items:center;gap:26px}

.tape{
  font-family:var(--brush);font-size:2.3rem;line-height:1;color:var(--ink);
  padding:12px 34px;transform:rotate(-2.5deg);position:relative;
  background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,#fbd2dc 10px 20px);
  box-shadow:0 3px 0 var(--shade);
  clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0);
}
h1{margin:0;font:inherit}

.dial{position:relative;width:min(80vw,310px);aspect-ratio:1;filter:drop-shadow(0 6px 0 var(--shade))}
.dial svg{width:100%;height:100%;display:block}
.paper{fill:var(--paper);transition:fill .3s}
.edge{fill:none;stroke:var(--ink);stroke-width:.8;stroke-dasharray:2.4 2.4;opacity:.5}
.stitch{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:3 3.4;opacity:.45}
.yarn{fill:none;stroke:var(--yarn);stroke-width:8;stroke-linecap:round;transition:stroke .3s}
.fluff{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:1.2 2.6;opacity:.55}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 22%}
.time{font-family:var(--brush);font-size:clamp(3rem,15vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.state{font-size:1.15rem;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.dial.alert .paper{fill:var(--blush)}
.dial.alert .yarn{stroke:var(--coral)}
.dial.alert .time,.dial.alert .state{color:var(--coral)}
.dial.alert{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

.beads{display:flex;gap:6px;height:26px;align-items:flex-end;width:100%;justify-content:center}
.beads i{width:14px;height:100%;border-radius:8px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.45);transition:background .08s,border-color .08s}
.beads i:nth-child(3n+1).on{background:var(--pink)}
.beads i:nth-child(3n+2).on{background:var(--felt)}
.beads i:nth-child(3n).on{background:var(--sky)}
.beads i.on{border-color:var(--ink);border-style:solid}

.wave{width:min(92vw,1600px);flex:none;background:var(--paper);border:2.5px dashed var(--ink);border-radius:14px;padding:10px 22px 8px;box-shadow:0 6px 0 var(--shade);transform:rotate(-.6deg)}
.wave .cap{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:2px}
.wave .cap b{font-family:var(--brush);font-weight:400;font-size:1.2rem}
.wscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.wwrap{position:relative}
.wlab{position:absolute;left:6px;z-index:1;pointer-events:none;font-size:.85rem;line-height:1.3;padding:0 7px;border-radius:9px;background:rgba(255,253,247,.8)}
#lyou{color:var(--yarn)}
#lspk{color:#5f8a1f}
.wscroll::-webkit-scrollbar{display:none;height:0}
.wave .cap{align-items:center}
.wave .cap .rt{display:flex;align-items:center;gap:12px}
.wave .cap button{font-size:1.05rem;padding:2px 16px;margin:0;box-shadow:0 3px 0 var(--shade)}
.wave .cap button::after{inset:3px;border-width:2px}
.wbar{position:relative;height:16px;margin-top:6px;border:2px dashed var(--ink);border-radius:999px;touch-action:none;cursor:pointer}
.wbar i{position:absolute;top:1px;bottom:1px;left:0;min-width:30px;border-radius:999px;background:var(--felt);border:2px solid var(--ink);cursor:grab;touch-action:none}
.wbar i:active{cursor:grabbing}
.wbar i b{position:absolute;top:-2px;bottom:-2px;width:18px;cursor:ew-resize;touch-action:none}
.wbar i b.l{left:-4px}
.wbar i b.r{right:-4px}
.wbar i b::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);opacity:.55}
.wave canvas{display:block;width:100%;height:150px}
.wcan{position:relative;width:max-content;min-width:100%}
.wcan.seek{cursor:pointer}
#phead{position:absolute;top:0;bottom:18px;width:4px;margin-left:-2px;background:var(--coral);border:1.5px solid var(--ink);border-radius:3px;pointer-events:none;display:none}
.pl{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pl[hidden]{display:none}
.pl button{font-size:1.1rem;padding:4px 16px;min-width:0;margin:0;box-shadow:0 3px 0 var(--shade)}
.pl button::after{inset:3px;border-width:2px}
.pl button:disabled{opacity:.45;cursor:default}
#pplay{min-width:68px;font-size:1.3rem;background:var(--coral);color:#fff}
#pplay::after{border-color:#fff}
#pdownload{position:absolute;right:0;top:50%;translate:0 -50%;opacity:0}
#ptime{font-variant-numeric:tabular-nums;min-width:5.6em;text-align:center}
.mk{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;margin-top:8px}
.mk input{font:inherit;font-size:.95rem;width:9em;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink)}
.mk[hidden]{display:none}
.mk .chip{display:inline-flex;align-items:stretch}
.mk .chip button{font-size:.95rem;padding:1px 10px;min-width:0;margin:0;background:var(--pink);box-shadow:0 2px 0 var(--shade)}
.mk .chip button::after{inset:2px;border-width:1.5px}
.mk .chip button.x{padding:1px 8px;margin-left:3px;background:var(--paper)}
#selInfo{font-size:.92rem;min-height:1.3em;color:var(--ink);opacity:.8;text-align:center;line-height:1.3}

button{
  font-family:var(--brush);font-size:1.7rem;color:var(--ink);cursor:pointer;
  background:var(--felt);border:0;border-radius:999px;padding:16px 44px;min-width:240px;position:relative;
  box-shadow:0 6px 0 var(--shade);transition:transform .1s,box-shadow .1s;
}
button::after{content:"";position:absolute;inset:6px;border:2.5px dashed var(--ink);border-radius:999px;opacity:.55;pointer-events:none}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shade)}
button.stop{background:var(--paper)}
button.ghost{font-size:1.3rem;padding:10px 28px;min-width:0;background:var(--sky);margin-top:-12px}
button.ghost::after{inset:4px}
button[hidden]{display:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}
.msg{min-height:1.3em;color:#fff;text-align:center;font-size:1.05rem;margin-top:-10px;text-shadow:0 1px 0 var(--shade);opacity:1;transition:opacity .3s}



.note{
  position:relative;width:100%;background:var(--note);padding:30px 22px 20px;transform:rotate(1.2deg);
  box-shadow:0 6px 0 var(--shade);display:grid;gap:6px;
  border-radius:2px 2px 26px 2px;
}
.note::before{
  content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg,rgba(143,208,238,.85) 0 10px,rgba(255,255,255,.75) 10px 20px);
}
.note label{display:flex;justify-content:space-between;align-items:baseline;font-size:1.2rem}
.note label b{font-family:var(--brush);font-weight:400;font-size:1.35rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0 0 6px}
input[type=range]::-webkit-slider-runnable-track{height:0;border-top:3px dashed var(--ink)}
input[type=range]::-moz-range-track{height:0;border-top:3px dashed var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);margin-top:-13px;box-shadow:0 2px 0 var(--shade)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--coral);border:3px solid var(--ink)}

input[type=checkbox]{width:26px;height:26px;accent-color:var(--coral);margin:0;cursor:pointer;flex:none}
@media (prefers-reduced-motion:reduce){.dial.alert{animation:none}button{transition:none}}

body.drop::after{
  content:"Drop audio to load it";position:fixed;inset:12px;z-index:10;pointer-events:none;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--brush);font-size:2.4rem;color:#fff;
  background:rgba(0,0,0,.4);border:4px dashed #fff;border-radius:24px;
}
</style>
</head>
<body>
<main>
  <!-- <div class="tape"><h1>i love my job!!</h1></div> -->

  <div class="dial" id="dial" role="timer" aria-live="off">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="paper" cx="60" cy="60" r="58"/>
      <circle class="edge" cx="60" cy="60" r="55.5"/>
      <g transform="rotate(-90 60 60)">
        <circle class="stitch" cx="60" cy="60" r="47"/>
        <circle class="yarn" id="prog" cx="60" cy="60" r="47" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
        <circle class="fluff" id="fluff" cx="60" cy="60" r="47" pathLength="100" stroke-dashoffset="0"/>
      </g>
    </svg>
    <div class="center">
      <div class="time" id="time">0:00</div>
      <div class="state" id="state">Not listening</div>
    </div>
  </div>

  <div class="beads" id="beads" aria-hidden="true"></div>

  <div class="wave">
    <div class="cap"><b>Session wave</b><span class="rt"><span id="wtime">0:00</span><button id="clr" class="ghost" type="button">Clear</button></span></div>
    <div class="wwrap"><div class="wscroll" id="wscroll"><div class="wcan" id="wcan"><canvas id="wave" role="img" aria-label="Waveform of the session so far"></canvas><div id="phead"></div></div></div><span class="wlab" id="lyou" hidden>you</span><span class="wlab" id="lspk" hidden>speaker</span></div>
    <div class="wbar" id="wbar" title="Drag the ends to zoom, double-click to reset"><i id="wthumb"><b class="l"></b><b class="r"></b></i></div>
    <div class="pl" id="pl" hidden>
      <button id="pback" type="button" aria-label="Back 10 seconds">&minus;10</button>
      <button id="pplay" type="button" aria-label="Play">&#9654;</button>
      <button id="pfwd" type="button" aria-label="Forward 10 seconds">+10</button>
      <span id="ptime">0:00 / 0:00</span>
      <button id="prate" type="button" aria-label="Playback speed">1&times;</button>
      <button id="pdownload" type="button">Download</button>
    </div>
    <div id="selInfo" aria-live="polite">Select a section to download</div>
    <div class="mk" id="mk" hidden></div>
  </div>

  <button id="btn">Start listening</button>
  <button id="pip" class="ghost">Float on top</button>
  <button id="mark" class="ghost" title="Shortcut: M">Add marker (M)</button>
  <button id="spk" class="ghost">Add speaker sound</button>
  <div class="msg" id="msg" role="status"></div>

  <div class="note">
    <label for="limit">Quiet limit <b id="limVal">2:00</b></label>
    <input type="range" id="limit" min="30" max="300" step="15" value="120">
    <label for="sens">Mic sensitivity <b id="sensVal">7</b></label>
    <input type="range" id="sens" min="1" max="10" value="7">
    <label for="ssens">Speaker sensitivity <b id="ssensVal">1</b></label>
    <input type="range" id="ssens" min="1" max="10" value="1">
    <label for="rep">Nag me every <b id="repVal">20s</b></label>
    <input type="range" id="rep" min="3" max="60" step="1" value="20">
    <label for="incl">Speaker sound counts as talking <input checked type="checkbox" id="incl"></label>
    <label for="ovl">Overlap waveforms <input type="checkbox" id="ovl" checked></label>
  </div>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var btn=$('btn'), pipBtn=$('pip'), dial=$('dial'), prog=$('prog'), fluff=$('fluff'), timeEl=$('time'), stateEl=$('state'),
      msg=$('msg'), limit=$('limit'), limVal=$('limVal'), sens=$('sens'), beadsEl=$('beads');
  var stream=null, ctx=null, analyser=null, buf=null, wakeLock=null, tick=null, worker=null, msgTimer=null;
  var lastSound=0, lastAlert=0, lastRun=0, alerting=false, running=false;
  var N=14, beads=[];
  for(var b=0;b<N;b++){var el=document.createElement('i');beadsEl.appendChild(el);beads.push(el)}

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function showMsg(text){
    clearTimeout(msgTimer);
    msg.textContent=text;
    msg.style.opacity='1';
    if(text) msgTimer=setTimeout(function(){
      msg.style.opacity='0';
      msgTimer=setTimeout(function(){msg.textContent='';msg.style.opacity='1'},300);
    },700);
  }
  limit.addEventListener('input',function(){limVal.textContent=fmt(+limit.value)});
  sens.addEventListener('input',function(){$('sensVal').textContent=sens.value});
  $('ssens').addEventListener('input',function(){$('ssensVal').textContent=$('ssens').value});
  $('rep').addEventListener('input',function(){$('repVal').textContent=$('rep').value+'s'});

  /* ---------- session waveform ---------- */
  var wc=$('wave'), wg=wc.getContext('2d'), BK=250;
  var peaks=[], speaks=[], flags=[], startT=0, lastWave=0, MAXV=1200, follow=true, wTot=60, viewSec=null;
  var spkStream=null, spkAn=null, spkBuf=null, spkUsed=false;
  var activeSelection=null, selecting=null, markers=[];
  function updateSelectionInfo(){
    var sel=activeSelection;
    var info=$('selInfo');
    var btn=$('pdownload');
    if(sel){
      info.textContent='Selected: '+fmt(sel.start)+' to '+fmt(sel.end)+' ('+fmt(sel.end-sel.start)+')';
      btn.textContent='Download selected';
    }else{
      info.textContent='';
      btn.textContent='Download';
    }
  }
  function getWaveTimeFromEvent(e){
    var r=wc.getBoundingClientRect();
    return (Math.max(0,Math.min(r.width,e.clientX-r.left))/r.width)*wTot;
  }
  function rec_(now,rms,sp){
    var i=Math.floor((now-startT)/BK);
    while(peaks.length<=i){peaks.push(0);speaks.push(0);flags.push(0)}
    if(rms>peaks[i]) peaks[i]=rms;
    if(sp>speaks[i]) speaks[i]=sp;
    if(alerting) flags[i]=1;
  }
  function markNow(){return running?Math.max(0,(performance.now()-startT)/1000):(segs.length?pos():0)}
  function mName(m,i){return m.label||('Marker '+(i+1))}
  function renderMarkers(){
    var box=$('mk'); box.innerHTML=''; box.hidden=!markers.length;
    markers.forEach(function(m,i){
      var c=document.createElement('span'); c.className='chip';
      var a=document.createElement('button'); a.type='button'; a.textContent=mName(m,i)+' \u00b7 '+fmt(m.t);
      a.setAttribute('aria-label','Go to '+mName(m,i));
      a.addEventListener('click',function(){
        var sc=$('wscroll'); follow=false;
        sc.scrollLeft=Math.max(0,m.t/wTot*sc.scrollWidth-40);
        if(!running&&segs.length) seekTo(m.t,isPlaying());
      });
      var e=document.createElement('button'); e.type='button'; e.className='x'; e.textContent='\u270e';
      e.setAttribute('aria-label','Rename '+mName(m,i));
      e.addEventListener('click',function(){editMarker(m,c)});
      var x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='\u00d7';
      x.setAttribute('aria-label','Remove '+mName(m,i));
      x.addEventListener('click',function(){markers.splice(markers.indexOf(m),1);renderMarkers();drawWave()});
      c.appendChild(a); c.appendChild(e); c.appendChild(x); box.appendChild(c);
    });
  }
  function editMarker(m,chip){
    chip.innerHTML='';
    var inp=document.createElement('input'); inp.type='text'; inp.maxLength=24; inp.value=m.label||'';
    inp.placeholder='Marker name'; inp.setAttribute('aria-label','Marker name');
    var done=false;
    function finish(save){
      if(done) return; done=true;
      if(save) m.label=inp.value.trim();
      renderMarkers(); drawWave();
    }
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){ev.preventDefault();finish(true)}
      else if(ev.key==='Escape'){ev.preventDefault();finish(false)}
    });
    inp.addEventListener('blur',function(){finish(true)});
    chip.appendChild(inp); inp.focus(); inp.select();
  }
  function addMarker(){
    if(!running&&!segs.length){showMsg('Start listening first, then add markers.');return}
    var t=markNow();
    if(markers.some(function(m){return Math.abs(m.t-t)<0.5})){
      showMsg('There is already a marker here');
      view.markText='Already marked'; view.markUntil=Date.now()+1200;
      draw(); setTimeout(draw,1300);
      return;
    }
    var m={t:t,label:''}; markers.push(m); markers.sort(function(a,b){return a.t-b.t});
    var n=markers.indexOf(m)+1;
    renderMarkers(); showMsg('Marker '+n+' at '+fmt(t));
    view.markText='Marker '+n; view.markUntil=Date.now()+1200;
    draw(); setTimeout(draw,1300);
    drawWave();
  }
  function drawWave(){
    var sc=$('wscroll'), vw=sc.clientWidth, el0=peaks.length/(1000/BK);
    if(!vw) return;
    var tot0=Math.max(60,el0);
    var vis=viewSec?Math.min(viewSec,tot0):(el0>MAXV?MAXV:tot0);
    vis=Math.min(tot0,Math.max(vis,2,tot0*vw/20000));
    wc.style.width=Math.round(vw*tot0/vis)+'px';
    var W=wc.clientWidth, H=wc.clientHeight, dpr=Math.min(window.devicePixelRatio||1,30000/W);
    if(wc.width!==Math.round(W*dpr)||wc.height!==Math.round(H*dpr)){wc.width=Math.round(W*dpr);wc.height=Math.round(H*dpr)}
    wg.setTransform(dpr,0,0,dpr,0,0); wg.clearRect(0,0,W,H);
    var ink=css('--ink'),yarn=css('--yarn'),coral=css('--coral'),lime=css('--lime');
    var axisH=18, area=H-axisH, elapsed=peaks.length/(1000/BK);
    var total=Math.max(60,elapsed), per=1000/BK, i, x;
    wTot=total;
    wg.fillStyle='rgba(143,160,200,.18)'; wg.fillRect(0,0,W,area);
    var steps=[10,30,60,120,300,600,1800,3600], st=steps[steps.length-1];
    for(i=0;i<steps.length;i++){if(steps[i]*W/total>=70){st=steps[i];break}}
    wg.font='12px "Patrick Hand","Segoe Print",cursive'; wg.textAlign='center'; wg.textBaseline='top';
    for(var t=st;t<total;t+=st){
      x=t/total*W; wg.fillStyle=ink; wg.globalAlpha=.35; wg.fillRect(x,0,1,area+4);
      wg.globalAlpha=.8; wg.fillText(fmt(t),Math.min(W-14,x),area+5);
    }
    wg.globalAlpha=1;
    var ov=spkUsed&&$('ovl').checked, hh=area/2-3;
    if(activeSelection){
      var selLeft=Math.min(activeSelection.start,activeSelection.end)/wTot*W;
      var selRight=Math.max(activeSelection.start,activeSelection.end)/wTot*W;
      wg.fillStyle='rgba(239,91,76,.22)';
      wg.fillRect(selLeft,0,Math.max(0,selRight-selLeft),area);
      wg.strokeStyle='rgba(239,91,76,.9)';
      wg.lineWidth=2;
      wg.strokeRect(selLeft+1,1,Math.max(0,selRight-selLeft-2),area-2);
    }
    var tm=0.05-(+sens.value-1)*0.0045, ts=0.05-(+$('ssens').value-1)*0.0045;
    var lanes=!spkUsed?[{a:peaks,t:tm,c:yarn,m:area/2,h:hh}]
      :ov?[{a:speaks,t:ts,c:lime,m:area/2,h:hh},{a:peaks,t:tm,c:yarn,m:area/2,h:hh}]

    if(tick) clearInterval(tick);
    if(worker){worker.terminate();worker=null}
    if(stream){stream.getTracks().forEach(function(t){t.stop()})}
    if(wakeLock){try{wakeLock.release()}catch(e){} wakeLock=null}
    dial.classList.remove('alert'); document.title='Keep talking';
    btn.textContent='Start listening'; btn.classList.remove('stop');
    stateEl.textContent='Not listening'; timeEl.textContent='0:00';
    setRing(0);
    beads.forEach(function(x){x.classList.remove('on')});
    view={silent:0,frac:0,text:'Not listening',alert:false}; draw();
    drawWave();
  }

  var spkBtn=$('spk');
  async function startSpk(){
    showMsg('');
    if(!running){showMsg('Start listening first, then add speaker sound.');return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){showMsg('This browser cannot capture speaker sound.');return}
    var ds;
    try{ds=await navigator.mediaDevices.getDisplayMedia({video:{width:1,height:1,frameRate:1},audio:true})}
    catch(e){showMsg('Sharing was cancelled.');return}
    if(!ds.getAudioTracks().length){
      ds.getTracks().forEach(function(t){t.stop()});
      showMsg('No audio shared. Pick a tab (or screen) and tick "Share audio".');return;
    }
    ds.getVideoTracks().forEach(function(t){t.stop()});
    spkStream=ds;
    var src=ctx.createMediaStreamSource(new MediaStream(ds.getAudioTracks()));
    spkAn=ctx.createAnalyser(); spkAn.fftSize=4096; spkBuf=new Uint8Array(spkAn.fftSize);
    spkSrc=src; if(recDest) src.connect(recDest);
    src.connect(spkAn);
    spkUsed=true; spkBtn.textContent='Remove speaker sound';
    ds.getAudioTracks()[0].addEventListener('ended',stopSpk);
  }
  function stopSpk(){
    if(spkStream){spkStream.getTracks().forEach(function(t){t.stop()});spkStream=null}
    if(spkSrc){try{spkSrc.disconnect()}catch(e){} spkSrc=null}
    spkAn=null; spkBtn.textContent='Add speaker sound';
  }
  spkBtn.addEventListener('click',function(){spkAn?stopSpk():startSpk()});
  btn.addEventListener('click',function(){running?stop():start()});
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && running && navigator.wakeLock && !wakeLock){
      navigator.wakeLock.request('screen').then(function(w){wakeLock=w}).catch(function(){});
    }
    if(!document.hidden) drawWave();
  });
  function clearWave(){
    dropRec();
    peaks=[]; speaks=[]; flags=[]; spkUsed=!!spkAn; follow=true; markers=[]; renderMarkers();
    if(running){startT=performance.now();restartRec()}
    $('wscroll').scrollLeft=0; drawWave();
  }
  $('clr').addEventListener('click',clearWave);
  $('mark').addEventListener('click',addMarker);
  document.addEventListener('keydown',function(e){
    if((e.key==='m'||e.key==='M')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.repeat&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')){
      e.preventDefault(); addMarker();
    }
  });
  /* the floating window's "next track" button drops a marker */
  try{
    navigator.mediaSession.setActionHandler('nexttrack',addMarker);
    navigator.mediaSession.metadata=new MediaMetadata({title:'Silence Reminder',artist:'Next track button = add marker'});
  }catch(e){}

  /* ---------- drop audio files ---------- */
  var dragDepth=0;
  function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0}
  window.addEventListener('dragenter',function(e){if(!hasFiles(e))return;e.preventDefault();dragDepth++;document.body.classList.add('drop')});
  window.addEventListener('dragover',function(e){if(hasFiles(e))e.preventDefault()});
  window.addEventListener('dragleave',function(e){
    if(!hasFiles(e))return;
    dragDepth=Math.max(0,dragDepth-1);
    if(!dragDepth)document.body.classList.remove('drop');
  });
  window.addEventListener('drop',function(e){
    if(!hasFiles(e))return;
    e.preventDefault();dragDepth=0;document.body.classList.remove('drop');
    var files=Array.prototype.filter.call(e.dataTransfer.files,function(f){
      return /^audio\//.test(f.type)||/\.(mp3|wav|m4a|ogg|webm)$/i.test(f.name);
    });
    if(!files.length){showMsg('Drop an mp3 audio file.');return}
    loadFiles(files);
  });

  async function loadFiles(files){
    if(running){showMsg('Stop listening first, then drop a file.');return}
    showMsg('Loading...');
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!ctx||ctx.state==='closed') ctx=new AC();
      var decoded=[];
      for(var i=0;i<files.length;i++){
        decoded.push(await ctx.decodeAudioData(await files[i].arrayBuffer()));
      }
      /* replace whatever is currently loaded/recorded */
      dropRec(); peaks=[]; speaks=[]; flags=[]; spkUsed=false; markers=[]; renderMarkers();
      var tm=0.05-(+sens.value-1)*0.0045, lim=+limit.value, per=1000/BK, lastS=0;
      decoded.forEach(function(b,k){
        var t0=peaks.length/per, nb=Math.ceil(b.duration*per), bs=b.sampleRate*BK/1000,
            ch=b.numberOfChannels, data=[], c;
        for(c=0;c<ch;c++) data.push(b.getChannelData(c));
        for(var j=0;j<nb;j++){
          var a=Math.floor(j*bs), z=Math.min(b.length,Math.floor((j+1)*bs)), pk=0;
          /* same idea as live: max RMS of ~4096-sample windows per bucket */
          for(var s=a;s<z;s+=4096){
            var en=Math.min(z,s+4096), sum=0;
            for(var x=s;x<en;x++){
              var v=0; for(c=0;c<ch;c++) v+=data[c][x];
              v/=ch; sum+=v*v;
            }
            var r=Math.sqrt(sum/Math.max(1,en-s)); if(r>pk) pk=r;
          }
          var tt=t0+j/per;
          if(pk>tm) lastS=tt;
          peaks.push(pk); speaks.push(0);
          flags.push(tt-lastS>=lim?1:0);   /* red where the quiet limit would have fired */
        }
        segs.push({blob:files[k],url:URL.createObjectURL(files[k]),start:t0,dur:b.duration});
      });
      follow=false; $('wscroll').scrollLeft=0;
      drawWave();
      showMsg('Loaded '+files.length+' file'+(files.length>1?'s':'')+'.');
    }catch(err){
      showMsg('Could not read that audio file.');
    }
  }

  drawWave();
})();
</script>
</body>
</html>
